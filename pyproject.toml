[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-learning"
version = "0.1.0"
description = "LLM learning notes and educational implementations (KDA / DeltaNet)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LMingyong" }]
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["papers/kda"]
include = ["kda*"]

[tool.pytest.ini_options]
testpaths = ["papers/kda"]
pythonpath = ["papers/kda"]
